<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NYC Aug 2026 🗽</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #09111E;
  --bg2:       #0E1A2B;
  --bg3:       #152035;
  --card:      #111E30;
  --border:    #1D3050;
  --text:      #E4ECF7;
  --text2:     #7A90AD;
  --accent:    #D4A840;
  --accent2:   #3A9EE0;
  --radius:    10px;
  --footer-h:  56px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;overflow-x:hidden}

/* ── HEADER ─────────────────────────────── */
#header{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top,0px);
}
#hdr-top{
  display:flex;align-items:center;justify-content:center;
  padding:10px 16px 6px;gap:8px;
}
#hdr-title{font-size:1rem;font-weight:700;color:var(--accent);letter-spacing:.03em}
#day-tabs{
  display:flex;overflow-x:auto;scrollbar-width:none;
  padding:0 10px 10px;gap:5px;
}
#day-tabs::-webkit-scrollbar{display:none}
.day-tab{
  flex-shrink:0;padding:5px 13px;border-radius:20px;
  font-size:.72rem;font-weight:500;cursor:pointer;
  background:var(--bg3);color:var(--text2);
  border:1px solid var(--border);transition:all .2s;
  white-space:nowrap;user-select:none;
}
.day-tab.active{
  background:var(--accent);color:#09111E;
  border-color:var(--accent);font-weight:700;
}

/* ── FOOTER ─────────────────────────────── */
#footer{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:var(--bg2);border-top:1px solid var(--border);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.fnav{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:8px 0;gap:2px;
  font-size:.62rem;color:var(--text2);cursor:pointer;
  transition:color .2s;user-select:none;
}
.fnav .fi{font-size:1.25rem;line-height:1}
.fnav.active{color:var(--accent)}

/* ── MAIN ────────────────────────────────── */
#main{min-height:100vh;padding-bottom:calc(var(--footer-h) + env(safe-area-inset-bottom,0px) + 8px)}
.view{display:none}
.view.active{display:block}

/* ── TODAY BANNER ─────────────────────────── */
#today-banner{
  background:linear-gradient(135deg,var(--accent) 0%,#E8C060 100%);
  color:#09111E;text-align:center;font-size:.78rem;font-weight:700;
  padding:6px 16px;display:none;
}
#today-banner.show{display:block}

/* ── TIMELINE ────────────────────────────── */
#tl-wrap{padding:10px 10px 16px;will-change:transform,opacity}
.day-head{
  text-align:center;font-size:.78rem;font-weight:700;
  color:var(--text2);letter-spacing:.06em;text-transform:uppercase;
  padding:4px 0 14px;
}

.tl{position:relative;padding-left:56px}
.tl::before{
  content:'';position:absolute;left:46px;top:0;bottom:0;
  width:2px;background:var(--border);border-radius:2px;
}

.tl-row{position:relative;margin-bottom:5px}

.tl-time{
  position:absolute;left:-56px;width:48px;
  text-align:right;top:13px;
  font-size:.67rem;font-weight:600;color:var(--text2);line-height:1;
}
.tl-dot{
  position:absolute;left:-10px;top:14px;
  width:8px;height:8px;border-radius:50%;
  background:var(--border);border:2px solid var(--bg2);z-index:1;
}
.tl-row.curr .tl-dot{background:var(--accent);box-shadow:0 0 0 3px rgba(212,168,64,.25)}

.act-card{
  border-radius:var(--radius);padding:10px 12px;
  cursor:pointer;transition:transform .12s;
  border-left:3px solid transparent;
  position:relative;overflow:hidden;
}
.act-card:active{transform:scale(.98)}

/* Category themes */
.c-atraccion{background:rgba(76,175,80,.1);border-left-color:#81C784}
.c-comida{background:rgba(255,152,0,.1);border-left-color:#FFB74D}
.c-tienda{background:rgba(206,147,216,.1);border-left-color:#CE93D8}
.c-paseo{background:rgba(79,195,247,.1);border-left-color:#81D4FA}
.c-dc{background:rgba(239,83,80,.09);border-left-color:#EF9A9A}
.c-transporte{background:rgba(144,164,174,.09);border-left-color:#90A4AE}
.c-gratis{background:rgba(255,241,118,.09);border-left-color:#FFF176}
.c-llegada{background:rgba(255,138,101,.1);border-left-color:#FFAB91}
.c-comida.c-llegada,.c-llegada{background:rgba(255,112,67,.09);border-left-color:#FF8A65}

/* Current time highlight */
.tl-row.curr .act-card::before{
  content:'▶ AHORA';position:absolute;top:0;right:0;
  font-size:.6rem;font-weight:700;letter-spacing:.08em;
  background:var(--accent);color:#09111E;
  padding:2px 7px;border-radius:0 var(--radius) 0 6px;
}

.act-head{display:flex;align-items:flex-start;gap:8px}
.act-emoji{font-size:1.05rem;flex-shrink:0;line-height:1.4;margin-top:1px}
.act-body{flex:1;min-width:0}
.act-title{font-size:.83rem;font-weight:600;line-height:1.3;color:var(--text)}
.act-price{font-size:.68rem;color:var(--accent);font-weight:500;margin-top:2px}
.act-chevron{font-size:.65rem;color:var(--text2);flex-shrink:0;margin-top:3px;transition:transform .2s}
.act-card.open .act-chevron{transform:rotate(180deg)}

.act-detail{
  display:none;margin-top:8px;padding-top:8px;
  border-top:1px solid rgba(255,255,255,.07);
  font-size:.77rem;color:var(--text2);line-height:1.55;
}
.act-card.open .act-detail{display:block}

.act-map{
  display:inline-flex;align-items:center;gap:4px;
  margin-top:7px;color:var(--accent2);font-size:.74rem;
  text-decoration:none;font-weight:500;
}
.act-map:hover{text-decoration:underline}

/* Transport divider */
.tl-transport{
  display:flex;align-items:center;gap:6px;
  padding:2px 0 3px 2px;font-size:.68rem;color:var(--text2);opacity:.65;
}

/* ── RESERVAS ─────────────────────────────── */
#res-view{padding:12px}
.prog-wrap{margin-bottom:14px}
.prog-bar-bg{height:6px;background:var(--bg3);border-radius:6px;overflow:hidden;margin-bottom:5px}
.prog-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:6px;transition:width .4s}
.prog-label{text-align:center;font-size:.73rem;color:var(--text2)}

.res-card{
  background:var(--card);border-radius:var(--radius);
  padding:12px 12px 12px 10px;margin-bottom:8px;
  display:flex;gap:10px;align-items:flex-start;
  border:1px solid var(--border);transition:opacity .25s;
}
.res-card.done{opacity:.45}
.res-card.done .res-title{text-decoration:line-through;color:var(--text2)}

.res-chk{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--border);flex-shrink:0;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;margin-top:1px;font-size:.75rem;color:transparent;
}
.res-chk.on{background:var(--accent);border-color:var(--accent);color:#09111E;font-weight:700}

.res-num{font-size:.62rem;font-weight:700;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.res-title{font-size:.84rem;font-weight:600;color:var(--text);line-height:1.3}
.res-meta{margin-top:6px;font-size:.73rem;color:var(--text2);line-height:1.6}
.res-price{color:var(--accent);font-weight:500}
.res-link a{color:var(--accent2);text-decoration:none;word-break:break-all}
.res-link a:hover{text-decoration:underline}
.res-tip{font-size:.71rem;color:var(--text2);margin-top:3px}
.res-urgent{
  background:rgba(255,152,0,.12);border:1px solid rgba(255,152,0,.25);
  border-radius:6px;padding:5px 8px;margin-top:6px;
  font-size:.71rem;color:#FFB74D;font-weight:500;
}

/* ── INFO ────────────────────────────────── */
#info-view{padding:12px}
.info-sec{
  background:var(--card);border-radius:var(--radius);
  margin-bottom:8px;border:1px solid var(--border);overflow:hidden;
}
.info-hdr{
  padding:12px 14px;font-size:.84rem;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  color:var(--text);user-select:none;
}
.info-chev{color:var(--text2);transition:transform .2s;font-size:.72rem}
.info-sec.open .info-chev{transform:rotate(180deg)}
.info-body{display:none;padding:0 14px 14px;font-size:.79rem;color:var(--text2);line-height:1.6}
.info-sec.open .info-body{display:block}

.irow{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05);gap:8px;
}
.irow:last-child{border-bottom:none}
.irow .ilabel{color:var(--text);font-weight:500;flex-shrink:0}
.irow .ival{text-align:right;font-size:.75rem}
.irow .ival a{color:var(--accent2);text-decoration:none}
.irow .ival a:hover{text-decoration:underline}
.irow.bold .ival{color:var(--accent);font-weight:700;font-size:.85rem}
.tip-line{margin-bottom:5px}
.app-line strong{color:var(--text)}

/* ── DESKTOP ─────────────────────────────── */
@media(min-width:560px){
  #header,#footer,#main{max-width:520px;left:50%;transform:translateX(-50%)}
  #main{position:relative}
}
</style>
</head>

/* ============================================================
   STATE
   ============================================================ */
let dayIdx = 0;
let curView = 'itin-view';
let animating = false;

function todayDayIdx() {
  const t = new Date().toISOString().slice(0,10);
  const i = DAYS.findIndex(d => d.date === t);
  if (i >= 0) return i;
  return new Date() < new Date('2026-08-18') ? 0 : DAYS.length - 1;
}

/* ============================================================
   TABS
   ============================================================ */
function buildTabs() {
  const wrap = document.getElementById('day-tabs');
  wrap.innerHTML = '';
  DAYS.forEach((d,i) => {
    const el = document.createElement('div');
    el.className = 'day-tab' + (i===dayIdx?' active':'');
    el.textContent = d.label;
    el.onclick = () => goDay(i);
    wrap.appendChild(el);
  });
}

function scrollTabVisible(i) {
  const tabs = document.querySelectorAll('.day-tab');
  if (tabs[i]) tabs[i].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

/* ============================================================
   TIMELINE
   ============================================================ */
function renderTimeline() {
  const d = DAYS[dayIdx];
  const wrap = document.getElementById('tl-wrap');
  const todayStr = new Date().toISOString().slice(0,10);
  const isToday = d.date === todayStr;
  const nowMin = isToday ? new Date().getHours()*60+new Date().getMinutes() : -1;

  const banner = document.getElementById('today-banner');
  if (isToday) { banner.className='show'; banner.textContent='📍 Hoy · '+d.label; }
  else banner.className='';

  const actToMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
  const isCurr = (i) => {
    if (!isToday) return false;
    const am = actToMin(d.acts[i].t);
    const nm = i+1 < d.acts.length ? actToMin(d.acts[i+1].t) : am+90;
    return nowMin >= am && nowMin < nm;
  };

  let html = `<div class="day-head">${d.head}</div><div class="tl">`;
  d.acts.forEach((a,i) => {
    const curr = isCurr(i);
    const mapUrl = a.addr ? `https://maps.google.com/?q=${encodeURIComponent(a.addr)}` : null;
    const price = a.price ? `<div class="act-price">💰 ${a.price}</div>` : '';
    const mapLink = mapUrl ? `<a class="act-map" href="${mapUrl}" target="_blank">📍 ${a.addr}</a>` : '';
    const transport = (i>0 && a.transport) ? `<div class="tl-transport">${a.transport}</div>` : '';

    html += `${transport}
    <div class="tl-row${curr?' curr':''}">
      <div class="tl-time">${a.t}</div>
      <div class="tl-dot"></div>
      <div class="act-card c-${a.cat}" onclick="this.classList.toggle('open')">
        <div class="act-head">
          <span class="act-emoji">${a.e}</span>
          <div class="act-body">
            <div class="act-title">${a.title}</div>
            ${price}
          </div>
          <span class="act-chevron">▾</span>
        </div>
        <div class="act-detail">
          ${a.desc || ''}
          ${mapLink}
        </div>
      </div>
    </div>`;
  });
  html += '</div>';
  wrap.innerHTML = html;
}

/* ============================================================
   DAY SWITCH + SWIPE
   ============================================================ */
function goDay(idx, dir) {
  if (idx===dayIdx || animating) return;
  const direction = dir || (idx>dayIdx?'left':'right');
  animating = true;
  const wrap = document.getElementById('tl-wrap');
  wrap.style.transition = 'opacity .15s,transform .15s';
  wrap.style.opacity = '0';
  wrap.style.transform = direction==='left' ? 'translateX(-18px)' : 'translateX(18px)';
  setTimeout(() => {
    dayIdx = idx;
    renderTimeline();
    buildTabs();
    scrollTabVisible(idx);
    wrap.style.transition = 'none';
    wrap.style.transform = direction==='left' ? 'translateX(18px)' : 'translateX(-18px)';
    wrap.style.opacity = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      wrap.style.transition = 'opacity .18s,transform .18s';
      wrap.style.opacity = '1';
      wrap.style.transform = 'translateX(0)';
      setTimeout(() => { animating = false; }, 220);
    }));
  }, 150);
}

let tx=0,ty=0;
document.addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
document.addEventListener('touchend', e=>{
  if (curView!=='itin-view') return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if (Math.abs(dx)>Math.abs(dy)*1.5 && Math.abs(dx)>45) {
    if (dx<0 && dayIdx<DAYS.length-1) goDay(dayIdx+1,'left');
    else if (dx>0 && dayIdx>0) goDay(dayIdx-1,'right');
  }
},{passive:true});

/* ============================================================
   RESERVAS
   ============================================================ */
function getChecked() { return JSON.parse(localStorage.getItem('res_done')||'{}'); }
function saveChecked(obj) { localStorage.setItem('res_done',JSON.stringify(obj)); }

function renderReservas() {
  const done = getChecked();
  const n = RESERVAS.filter(r=>done[r.id]).length;
  const pct = Math.round(n/RESERVAS.length*100);
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-label').textContent = `${n}/${RESERVAS.length} completados · ${pct}%`;

  document.getElementById('res-list').innerHTML = RESERVAS.map(r => {
    const ck = !!done[r.id];
    return `<div class="res-card${ck?' done':''}">
      <div class="res-chk${ck?' on':''}" onclick="toggleRes(${r.id})">${ck?'✓':''}</div>
      <div style="flex:1">
        <div class="res-num">${String(r.id).padStart(2,'0')}</div>
        <div class="res-title">${r.title}</div>
        <div class="res-meta">
          <div>⏰ ${r.cuando}</div>
          <div class="res-price">💰 ${r.precio}</div>
          ${r.link?`<div class="res-link">🔗 <a href="${r.link}" target="_blank">${r.link}</a></div>`:''}
          ${r.tip?`<div class="res-tip">💡 ${r.tip}</div>`:''}
        </div>
        ${r.urgent?`<div class="res-urgent">⚠️ ACCIÓN EN MOMENTO EXACTO — Ver descripción</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function toggleRes(id) {
  const d = getChecked();
  d[id] = !d[id];
  saveChecked(d);
  renderReservas();
}

/* ============================================================
   INFO
   ============================================================ */
function renderInfo() {
  document.getElementById('info-view').innerHTML = INFO.map(sec => {
    let body = '';
    if (sec.type==='custom') body = sec.html;
    else if (sec.type==='rows') body = sec.rows.map(r =>
      `<div class="irow${r.bold?' bold':''}">
        <span class="ilabel">${r.l}</span>
        <span class="ival">${r.link?`<a href="${r.link}" target="_blank">${r.v}</a>`:r.v}</span>
      </div>`).join('');
    else if (sec.type==='items') body = sec.items.map(it =>
      `<div class="app-line" style="margin-bottom:6px"><strong>${it.name}:</strong> ${it.d}</div>`).join('');
    else if (sec.type==='tips') body = sec.tips.map(t =>
      `<div class="tip-line">${t}</div>`).join('');

    return `<div class="info-sec" id="is-${sec.id}">
      <div class="info-hdr" onclick="document.getElementById('is-${sec.id}').classList.toggle('open')">
        <span>${sec.title}</span><span class="info-chev">▾</span>
      </div>
      <div class="info-body">${body}</div>
    </div>`;
  }).join('');
}

/* ============================================================
   VIEW SWITCH
   ============================================================ */
function showView(id, btn) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.fnav').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  curView = id;
  if (id==='res-view') renderReservas();
  window.scrollTo(0,0);
}

/* ============================================================
   HEADER HEIGHT ADJUSTMENT
   ============================================================ */
function fitHeader() {
  const h = document.getElementById('header').offsetHeight;
  document.getElementById('main').style.paddingTop = (h+2)+'px';
}

/* ============================================================
   BOOT
   ============================================================ */
dayIdx = todayDayIdx();
buildTabs();
renderTimeline();
renderInfo();
fitHeader();
scrollTabVisible(dayIdx);
window.addEventListener('resize', fitHeader);
</script>
